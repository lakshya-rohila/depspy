[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "depspy"
version = "0.1.0"
description = "Dependency Detective — visualize, audit, and score your Python dependencies"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["dependencies", "security", "tui", "audit", "cli", "devtools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.47.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "typer>=0.9.0",
    "packaging>=23.0",
    "diskcache>=5.6.0",
    "tomli>=2.0.0; python_version < \"3.11\"",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "mypy>=1.0", "ruff>=0.1"]

[project.scripts]
depspy = "depspy.cli:main"

[project.urls]
Homepage = "https://github.com/yourname/depspy"
Documentation = "https://github.com/yourname/depspy#readme"
Repository = "https://github.com/yourname/depspy"

[tool.hatch.build.targets.wheel]
packages = ["src/depspy"]

[tool.hatch.build.targets.sdist]
include = ["src/depspy", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"src/depspy/cli.py" = ["B008"]
"src/depspy/screens/loading_art.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["depspy"]
